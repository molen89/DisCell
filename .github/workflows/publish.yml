name: publish

# Builds the sdist and wheel and uploads them to PyPI by trusted publishing (OIDC).
# Runs only when a version tag (v*) is pushed, never on ordinary pushes or pull requests.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
      - name: Check the distributions
        run: twine check --strict dist/*
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import pathlib, re; s = pathlib.Path('src/discell/_version.py').read_text(); print(re.search(r'__version__ = \"(.+)\"', s).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/discell/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
