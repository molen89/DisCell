[project]
name = "discell"
version = "0.1.0"
description = "Spatial transcriptomics preprocessing and modelling for Visium HD / Xenium"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "anndata>=0.11",
    "scanpy>=1.10",
    "h5py>=3.11",
    "scikit-misc>=0.5", # loess backend for scanpy's seurat_v3 HVG flavor
    "pyarrow>=16", # tissue_positions.parquet
    "shapely>=2.0", # cell polygon geometry
    "tifffile>=2024.1", # lazy tiled/strip access to multi-GB BigTIFF
    "imagecodecs>=2024.1", # JPEG-compressed TIFF tiles
    "pillow>=10",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.8"]
viz = [
    "pyqt6>=6.11.0",
    "tornado>=6.5.8",
]
kronos = [
    "huggingface-hub>=0.24",
    "kronos",
    "omegaconf>=2.3",
    "safetensors>=0.8.0",
    "timm>=1.0.19",
    "torch>=2.4",
    "transformers>=4.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discell"]

[tool.uv.sources]
kronos = { git = "https://github.com/mahmoodlab/KRONOS.git" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
