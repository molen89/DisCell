[project]
name = "discell"
version = "0.1.0"
description = "Cell polygons, neighbour graphs and image embeddings from 10x Xenium, served as subgraph batches"
requires-python = ">=3.12"

# Everything `discell` imports by name. Transitive availability is not a
# declaration: anndata happens to pull zarr and scanpy happens to pull
# matplotlib and umap-learn, but this package imports all three itself, so it
# pins all three itself.
dependencies = [
    # arrays, tables, geometry
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "shapely>=2.0",             # polygon validity repair, apposed-wall measurement
    # the AnnData world
    "anndata>=0.11",            # a bundle's .h5ad
    "scanpy>=1.10",             # only for read_10x_h5; ~285 MB of tree for one call
    "pyarrow>=16",              # polygon and edge parquet -- pandas ships it as an extra
    # imaging: one window out of a multi-GB BigTIFF, without decoding the slide
    "tifffile[codecs]>=2024.1", # [codecs] is what decodes the JPEG-compressed tiles
    "zarr>=3.1",                # tifffile.aszarr() is opened through it
    # modelling and figures
    "torch>=2.4",
    "matplotlib>=3.8",          # discell.main plots by default, as does --figures
    "umap-learn>=0.5",          # --figures qc
    "tensorboard>=2.16",        # training-loop logging
]

[project.optional-dependencies]
# Per-cell image embeddings. Both KRONOS versions sit behind this one extra; the
# weights are gated, so request access and set HF_TOKEN before using it.
kronos = [
    "kronos",                   # v1, from git; brings torch and xformers itself
    "transformers>=4.56",       # v2 loads via AutoModel + trust_remote_code
    "omegaconf>=2.3",           # imported by KRONOS2's downloaded remote code
    "huggingface-hub>=0.24",    # marker metadata and weight download
]

# Interactive pan/zoom instead of a written PNG, for
# discell.preprocess.plotting.show. Qt drives a local or X-forwarded display;
# tornado serves the WebAgg fallback when X is too slow to be usable.
viz = ["pyqt6>=6.11", "tornado>=6.5"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["discell"]

[tool.uv.sources]
kronos = { git = "https://github.com/mahmoodlab/KRONOS.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
